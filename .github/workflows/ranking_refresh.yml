name: Ranking Refresh

on:
  schedule:
    - cron: "0 6 * * 1,3,5"  # 06:00 UTC Monday, Wednesday, Friday
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

# Prevents two ranking runs from overlapping (e.g. a manual dispatch firing
# while the scheduled run is still in progress) -- a v1 upsert racing itself
# is exactly the kind of thing that produces confusing partial-write bugs.
concurrency:
  group: ranking-refresh
  cancel-in-progress: false

permissions:
  contents: read   # this workflow only calls Supabase/LLM APIs; it never pushes to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper (v1 pipeline)
        id: run_scraper
        working-directory: scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python main.py

      - name: Write run summary
        if: always()
        run: |
          {
            echo "### Ranking refresh — $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "- Pipeline: v1 (\`scraper/main.py\`)"
            echo "- Result: ${{ steps.run_scraper.outcome }}"
            echo ""
            echo "_Note: this workflow still runs the v1 pipeline. The v2 pipeline"
            echo "(\`scraper/main_v2.py\`, richer verification + regional ranking + a"
            echo "quality report) is available for manual testing via the separate"
            echo "\"Ranking Refresh v2 (manual test)\" workflow -- see MIGRATION.md"
            echo "before switching this scheduled workflow over to it._"
          } >> "$GITHUB_STEP_SUMMARY"
